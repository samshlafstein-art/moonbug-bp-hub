name: 'moonbug_bp_hub'
version: '1.0.0'
config-version: 2

profile: 'moonbug_bp_hub'

model-paths: ["models"]
seed-paths: ["seeds"]
macro-paths: ["macros"]

target-path: "target"
clean-targets:
  - "target"
  - "dbt_packages"

models:
  moonbug_bp_hub:
    staging:
      +materialized: view
      +schema: staging
    intermediate:
      +materialized: view
      +schema: intermediate
    marts:
      +materialized: table
      +schema: analytics

vars:
  # "as of" date the synthetic data was generated relative to — used for
  # pacing / days-to-pay / stale-deal calculations instead of hardcoding CURRENT_DATE,
  # so the demo numbers stay meaningful no matter when you actually run dbt.
  as_of_date: '2026-09-20'
